name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm run lint

      - name: Biome format check
        run: pnpm run format:check

      - name: Check diagnostics/docs sync + support-state coherence
        run: pnpm run docs:diagnostics:sync
      - name: Check fastify scaffold example/fixture sync
        run: pnpm run docs:scaffold:sync

      - name: Build
        run: pnpm run build

      - name: Check install-first example builds (pnpm install + build:go)
        run: pnpm run examples:install-first:check

      - name: Test
        run: pnpm run test

      - name: Setup Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: ${{ hashFiles('Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo fmt --all --check

      - name: Cargo clippy
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo test --workspace --all-targets

      - name: Check scaffold regeneration/sync
        run: pnpm run scaffold:sync:check

  smoke-executable:
    name: Smoke executable path (TS -> Go -> run -> health)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build JS packages
        run: pnpm run build

      - name: Preflight diagnostics (env/bin)
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          for cmd in node pnpm cargo go curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "[ok] $cmd => $(command -v "$cmd")"
            else
              echo "[missing] required command '$cmd' not found on PATH"
              echo "--- /usr/local/bin ---"
              ls -la /usr/local/bin || true
              echo "--- /usr/bin ---"
              ls -la /usr/bin || true
              exit 1
            fi
          done
          node -v
          pnpm -v
          cargo --version
          go version
          curl --version | head -n 1
          echo "TSGODOWN_RUST_ENGINE_BIN(default)=$GITHUB_WORKSPACE/scripts/rust-engine-launcher.sh"
          test -x "$GITHUB_WORKSPACE/scripts/rust-engine-launcher.sh" || {
            echo "missing executable launcher: $GITHUB_WORKSPACE/scripts/rust-engine-launcher.sh"
            ls -la "$GITHUB_WORKSPACE/scripts" || true
            exit 1
          }

      - name: Run M1 smoke script (build -> go build -> run -> health)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-m1.sh ./scripts/rust-engine-launcher.sh
          ./scripts/smoke-m1.sh
